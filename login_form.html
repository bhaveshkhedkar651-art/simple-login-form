<!DOCTYPE html>
<html>
<head>
    <title>Login Form</title>

    <style>
        body{
            margin:0;
            padding:0;
            font-family: Arial;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .login-box{
            background:white;
            padding:30px;
            width:300px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
            text-align:center;
        }

        h2{
            margin-bottom:20px;
            color:#333;
        }

        input{
            width:100%;
            padding:10px;
            margin:10px 0;
            border:1px solid #ccc;
            border-radius:5px;
        }

        button{
            width:100%;
            padding:10px;
            background:#4facfe;
            color:white;
            border:none;
            border-radius:5px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#008cdd;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h2>Login</h2>

        <form>
            <input type="text" placeholder="Username">
            <input type="password" placeholder="Password">

            <button type="submit">Login</button>
        </form>
    </div>

</body>
</html>
